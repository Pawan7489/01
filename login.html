<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>A1 CORE | SYSTEM LOGIN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="stylesheet" href="./css/adminlte.css" />
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      /* --- A1 CUSTOM HACKER THEME --- */
      body {
        background-color: #050505; /* Deep Black */
        color: #00ff41; /* Hacker Green */
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
      }
      
      /* Grid Background Effect */
      body::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: 
          linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
        background-size: 30px 30px;
        z-index: -1;
      }

      .login-box {
        width: 450px;
        margin: 8% auto;
        border: 1px solid #333;
        box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        background: rgba(10, 10, 10, 0.95);
        border-radius: 4px;
      }

      .card {
        background: transparent;
        border: none;
      }

      .card-header {
        border-bottom: 1px solid #333;
        background: #000;
        text-align: center;
        padding: 20px;
      }

      .login-logo a {
        color: #fff;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 24px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      .login-logo b {
        color: #dc3545; /* Red for "A1" */
      }

      .form-control {
        background: #0f0f0f;
        border: 1px solid #333;
        color: #00ff41;
        border-radius: 0;
      }

      .form-control:focus {
        background: #000;
        border-color: #00ff41;
        box-shadow: 0 0 5px rgba(0, 255, 65, 0.3);
        color: #fff;
      }

      .input-group-text {
        background: #1a1a1a;
        border: 1px solid #333;
        color: #666;
        border-radius: 0;
      }

      .btn-primary {
        background: #005500;
        border: 1px solid #00ff41;
        color: #00ff41;
        font-weight: bold;
        letter-spacing: 1px;
        transition: all 0.3s;
        border-radius: 0;
        text-transform: uppercase;
      }

      .btn-primary:hover {
        background: #00ff41;
        color: #000;
        box-shadow: 0 0 15px #00ff41;
      }

      .system-status {
        margin-top: 15px;
        font-size: 12px;
        color: #444;
        text-align: center;
        border-top: 1px solid #222;
        padding-top: 10px;
      }
      
      .blink {
        animation: blinker 1.5s linear infinite;
        color: #dc3545;
      }
      
      @keyframes blinker {
        50% { opacity: 0; }
      }
    </style>
  </head>
  
  <body class="login-page">
    <div class="login-box">
      <div class="card">
        <div class="card-header">
          <div class="login-logo">
            <a href="#"><b>A1</b> CORE ENGINE</a>
          </div>
          <p class="m-0 text-secondary" style="font-size: 0.8rem;">SECURE ACCESS GATEWAY</p>
        </div>
        
        <div class="card-body login-card-body">
          <p class="login-box-msg text-white">IDENTIFY YOURSELF</p>

          <form action="./index.html" method="post">
            <div class="input-group mb-3">
              <input type="text" class="form-control" placeholder="COMMANDER ID" required>
              <div class="input-group-text">
                <i data-lucide="user"></i>
              </div>
            </div>
            
            <div class="input-group mb-3">
              <input type="password" class="form-control" placeholder="ACCESS KEY" required>
              <div class="input-group-text">
                <i data-lucide="lock"></i>
              </div>
            </div>

            <div class="row mt-4">
              <div class="col-8">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="flexCheckDefault" style="background-color: #333; border-color: #555;">
                  <label class="form-check-label text-secondary" for="flexCheckDefault">
                    Keep Session Active
                  </label>
                </div>
              </div>
              <div class="col-4">
                <button type="submit" class="btn btn-primary w-100">ENTER</button>
              </div>
            </div>
          </form>

          <div class="system-status">
            <span>SERVER STATUS: <span class="text-success">ONLINE</span></span> | 
            <span>ENCRYPTION: <span class="text-success">AES-256</span></span>
            <br>
            <span class="blink">⚠ UNAUTHORIZED ACCESS IS PROHIBITED</span>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/adminlte.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
